<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>版本4｜掉落練習</title>
<style>
:root{--ink:#5a3a46;--cream:#fff7f9;--rose:#e8789b;--tile:clamp(56px,10vw,76px);font-family:system-ui,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--ink);line-height:1.7;box-sizing:border-box}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:#ffe3ee}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1;image-rendering:pixelated;object-fit:cover;object-position:center bottom}
main{max-width:960px;margin:auto;padding:24px 20px 100px}
a.home{display:inline-block;padding:6px 16px;background:var(--cream);color:var(--ink);font-weight:800;text-decoration:none;border:3px solid var(--ink);box-shadow:0 4px 0 var(--rose)}
.head{display:flex;align-items:flex-end;gap:16px;margin:22px 0 6px}
.spr{image-rendering:pixelated;display:block}
.eyebrow{margin:0;font-size:13px;letter-spacing:.16em;font-weight:700;color:#a14a6b}
h1{margin:4px 0 0;font-size:clamp(28px,5vw,46px);line-height:1.25;font-weight:900;color:#fff;-webkit-text-stroke:8px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--rose),0 8px 0 var(--ink)}
.lead{display:inline-block;margin:18px 0 22px;padding:6px 18px;background:var(--cream);border:3px solid var(--ink);box-shadow:0 4px 0 var(--rose)}
#game{background:var(--cream);border:4px solid var(--ink);border-radius:6px;box-shadow:0 8px 0 #0003;padding:22px;outline:none}
.hud{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.score{min-width:104px;text-align:center;padding:6px 14px;background:#ffeef3;border:3px solid var(--ink);font-weight:800}
.score b{display:block;font-size:34px;line-height:1.2}
.set{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0}
.box{padding:10px 16px;background:#fff0e6;border:3px solid var(--ink);font-weight:700}
.box input[type=range]{width:100%;accent-color:var(--rose)}
.box input[type=checkbox]{width:20px;height:20px;accent-color:var(--rose);vertical-align:-4px}
.box small{display:flex;justify-content:space-between;font-weight:600;color:#a14a6b}
#field{position:relative;height:340px;overflow:hidden;border:4px solid var(--ink);background:linear-gradient(#ffe9f0,#ffd3e1)}
.sky{position:absolute;inset:0 0 34px 0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),#5a3a4614 calc(10% - 1px) 10%)}
.ground{position:absolute;left:0;right:0;bottom:0;height:34px;display:flex;background:#9bd8a8;border-top:4px solid #5a8f68;font-weight:800;font-size:14px;color:#2f6b43}
.ground span{flex:1;text-align:center;line-height:30px}
.tile{position:absolute;width:var(--tile);height:var(--tile);margin-left:calc(var(--tile)/-2);display:grid;place-items:center;font-size:calc(var(--tile)*.62);font-weight:900;background:#ffcc4d;border:4px solid var(--ink);box-shadow:0 6px 0 #8a4b14,inset 0 -6px 0 #e8a33a,inset 0 6px 0 #ffe58f}
.tile.hit{background:#8fe3a0;box-shadow:0 6px 0 #3f8d54;animation:vanish .5s steps(5) forwards}
.tile.miss{background:#eadde1;color:#9a8790;box-shadow:0 6px 0 #b7a5ab;animation:shake .3s steps(4)}
.veil{position:absolute;inset:0;z-index:5;display:grid;place-content:center;justify-items:center;gap:8px;text-align:center;padding:20px;background:#fff7f9ee}
.veil h2{margin:0;font-size:30px}.veil p{margin:0}
#field.shake{animation:shake .3s steps(4)}
#msg{min-height:3.4em;margin:16px auto 6px;text-align:center;font-size:17px}
.ctl{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:22px}
button{font:inherit;font-size:18px;font-weight:800;padding:10px 24px;cursor:pointer;color:var(--ink);background:#ff9eb5;border:3px solid var(--ink);border-radius:4px;box-shadow:0 5px 0 #c9577a}
button.sec{background:#fff;box-shadow:0 5px 0 #b7a5ab}
button:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 #c9577a}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid #c9577a;outline-offset:3px}
.kbs{overflow-x:auto;padding-bottom:6px}
.kbw{container-type:inline-size;width:100%;min-width:560px;max-width:880px;margin:auto}
.kb{width:95.1cqw;margin:0 auto;padding:2.4cqw 0 2.3cqw;background:#c3cdc7;border:.35cqw solid #7f978c;border-radius:2.6cqw}
.r{display:flex;gap:.83cqw;margin-bottom:1.5cqw}
.r:nth-child(1){margin-left:3.1cqw}.r:nth-child(2){margin-left:4.9cqw}.r:nth-child(3){margin-left:6.5cqw}.r:nth-child(4){margin-left:8.1cqw}
.r:nth-child(5){margin:2.1cqw 0 0 25.7cqw}
.k{position:relative;display:grid;place-items:center;width:6.1cqw;height:5.4cqw;font-size:2.4cqw;font-weight:600;color:#2a3d38;background:#faf9f3;border:.12cqw solid #8b9d93;border-radius:.9cqw;box-shadow:0 .35cqw 0 #9fb0a5}
.k.p{background:#e4b7a3}
.k.sp{width:43.75cqw;height:3.5cqw;font-size:1.7cqw;color:#4d625a}
.k.lit{background:#c9302c;color:#fff;border-color:#7a1f1d;box-shadow:0 0 0 .5cqw #f6d7b8,0 .35cqw 0 #7a1f1d;transform:translateY(-.3cqw)}
.k.down{transform:translateY(.35cqw);box-shadow:none}
.k.bad{background:#ffb3b3}
.hop{animation:hop .3s steps(3)}
@keyframes vanish{60%{transform:scale(1.15)}100%{transform:scale(0);opacity:0}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes hop{50%{transform:translateY(-12px)}}
@media(max-width:700px){main{padding:16px 12px 90px}#game{padding:14px}.set{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="bg" width="192" height="108" aria-hidden="true"></canvas>
<main>
  <a class="home" href="../index.html">← 回到開發歷程</a>
  <div class="head">
    <canvas id="bun" class="spr" aria-hidden="true"></canvas>
    <div><p class="eyebrow">VERSION 04</p><h1>掉落練習</h1></div>
  </div>
  <p class="lead">字母會往下掉，落地前按下同一個鍵！練習 A S D F G H J K L ; 十個鍵（請用電腦鍵盤）。</p>

  <section id="game" tabindex="-1" aria-label="練習區">
    <div class="hud">
      <div class="score">題數<b id="qn">0/10</b></div>
      <div class="score">答對<b id="ok">0</b></div>
      <div class="score">落地<b id="land">0</b></div>
      <div class="score">按錯<b id="bad">0</b></div>
    </div>
    <div class="set">
      <div class="box">
        <label for="sec">每個字母落地時間：<b id="secVal">8</b> 秒</label>
        <input id="sec" type="range" min="3" max="14" step="1" value="8" aria-valuetext="8 秒">
        <small><span>3 秒（快）</span><span>14 秒（慢）</span></small>
      </div>
      <div class="box">
        <label><input id="accel" type="checkbox"> 漸進加速</label>
        <small><span>每答對 3 題縮短 1 秒，最短 3 秒</span></small>
        <small><span>這一題實際：<b id="cur">8</b> 秒</span></small>
      </div>
    </div>

    <div id="field">
      <div class="sky"><div id="tile" class="tile" hidden></div></div>
      <div class="ground" aria-hidden="true"></div>
      <div id="veil" class="veil"><h2 id="vt"></h2><p id="vb"></p><button id="vbtn" type="button"></button></div>
    </div>

    <p id="msg" role="status">按「開始」，開始練習。</p>
    <div class="ctl">
      <button id="start" type="button">▶ 開始</button>
      <button id="pause" class="sec" type="button" disabled>⏸ 暫停</button>
    </div>
    <div class="kbs" aria-hidden="true"><div class="kbw"><div class="kb" id="kb"></div></div></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const INK = '#5a3a46';
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; };
const R = (g, col, ...a) => { g.fillStyle = col; a.forEach(([x, y, w, h]) => g.fillRect(x, y, w, h)); };
const disc = (g, col, cx, cy, r) => { g.fillStyle = col; for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) if (x * x + y * y <= r * r + r * .6) g.fillRect(cx + x, cy + y, 1, 1); };

/* ---------- 像素小圖 ---------- */
function bunny() {
  const [c, g] = mk(28, 33), B = [[5,9,18,14],[3,11,22,10],[6,0,5,12],[17,1,5,11],[7,22,14,6],[6,23,16,4],[6,27,6,3],[16,27,6,3],[3,23,4,4],[21,23,4,4]], LF = [[11,7,3,2],[14,5,3,2],[13,8,1,2]];
  const f = (col, x, y, w, h) => { g.fillStyle = col; g.fillRect(x + 1, y + 1, w, h); };
  g.fillStyle = INK; B.concat(LF).forEach(([x, y, w, h]) => g.fillRect(x, y, w + 2, h + 2));
  B.forEach(r => f('#fffaf0', ...r)); LF.forEach(r => f('#6bcb77', ...r));
  f('#f3e2d2',10,25,8,2); f('#ffadc6',7,2,3,8); f('#ffadc6',18,3,3,7); f('#ffadc6',6,18,3,2); f('#ffadc6',19,18,3,2);
  f('#ffadc6',13,17,2,1); f('#d9546a',13,18,2,2); f('#ff7aa2',6,21,16,3); f('#e8456b',18,23,3,4);
  f('#2b2233',9,15,2,3); f('#2b2233',17,15,2,3); f('#fff',9,15,1,1); f('#fff',17,15,1,1);
  return c;
}
function tree() {
  const [c, g] = mk(36, 40);
  R(g, INK, [15,23,7,16]); R(g, '#c99a86', [16,23,5,15]); R(g, '#a97a68', [19,23,2,15]);
  disc(g, INK, 18, 15, 12); disc(g, '#7cc794', 18, 15, 11); disc(g, '#9fdcae', 17, 13, 9); R(g, '#c8f2d0', [11,6,4,2],[10,8,2,2]);
  [[9,11],[22,8],[16,18],[25,16],[12,19],[20,12]].forEach(([x, y]) => { R(g, '#e8456b', [x,y,3,3]); R(g, '#fff', [x,y,1,1]); });
  return c;
}
const bun = $('bun');
bun.width = 28; bun.height = 33; bun.getContext('2d').drawImage(bunny(), 0, 0); bun.style.width = '84px'; bun.style.height = '99px';

(function () {
  const g = $('bg').getContext('2d'), GY = 92, T = tree();
  ['#ffe9f0', '#ffdfea', '#ffd3e1', '#ffc8d9'].forEach((c, i) => R(g, c, [0, i * 24, 192, 24]));
  disc(g, '#fff3b8', 152, 22, 9);
  [[18,20],[70,34],[118,14],[168,46]].forEach(([x, y]) => R(g, '#fff', [x, y, 24, 5], [x + 5, y - 4, 13, 4]));
  for (let x = 0; x < 192; x++) { const h = 24 + 8 * Math.sin(x / 26) + 3 * Math.sin(x / 8); R(g, '#d9f1df', [x, GY - h, 1, h]); }
  for (let x = 0; x < 192; x++) { const h = 10 + 6 * Math.sin(x / 17 + 2); R(g, '#bfe6c8', [x, GY - h, 1, h]); }
  R(g, '#9bd8a8', [0, GY, 192, 16]); R(g, '#bff0c8', [0, GY, 192, 3]);
  g.drawImage(T, 10, GY - 35); g.drawImage(T, 148, GY - 36);
})();

/* ---------- 鍵盤 ---------- */
const SYM = { '-':'Minus','=':'Equal','[':'BracketLeft',']':'BracketRight',';':'Semicolon',"'":'Quote',',':'Comma','.':'Period','/':'Slash' };
const codeOf = ch => /[A-Z]/.test(ch) ? 'Key' + ch : /\d/.test(ch) ? 'Digit' + ch : SYM[ch];
const keyEls = {};
['1234567890-=', 'QWERTYUIOP[]', "ASDFGHJKL;'", 'ZXCVBNM,./', null].forEach((row, ri) => {
  const r = document.createElement('div'); r.className = 'r';
  (row ? [...row] : ['SPACE']).forEach((ch, i) => {
    const k = document.createElement('div'); k.className = 'k'; k.textContent = ch;
    if (!row) { k.classList.add('sp'); keyEls.Space = k; }
    else { if (ri === 2 && i < 10) k.classList.add('p'); keyEls[codeOf(ch)] = k; }
    r.appendChild(k);
  });
  $('kb').appendChild(r);
});

/* ---------- 遊戲 ---------- */
const KEYS = [...'ASDFGHJKL;'], TOTAL = 10, GAP = 650;
const tile = $('tile'), msg = $('msg'), game = $('game'), field = $('field');
let running = false, paused = false, st = 'idle', asked = 0, ok = 0, landed = 0, wrong = 0;
let target = null, prog = 0, dur = 8000, gap = 0, raf = 0, last = 0, saved = '', veilAct = null;

KEYS.forEach(c => { const s = document.createElement('span'); s.textContent = c; document.querySelector('.ground').appendChild(s); });

const name = c => c === ';' ? '分號 ;' : c;
const base = () => +$('sec').value;
const secNow = () => $('accel').checked ? Math.max(3, base() - Math.floor(ok / 3)) : base();
function pop(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
function setTop(p) { tile.style.top = `calc((100% - var(--tile)) * ${p})`; }
function hud() {
  $('qn').textContent = asked + '/' + TOTAL; $('ok').textContent = ok; $('land').textContent = landed; $('bad').textContent = wrong;
  $('secVal').textContent = base(); $('sec').setAttribute('aria-valuetext', base() + ' 秒'); $('cur').textContent = secNow();
}
function clearKeys() { Object.values(keyEls).forEach(k => k.classList.remove('lit', 'down', 'bad')); }
function showVeil(t, b, btn, fn) { $('vt').textContent = t; $('vb').innerHTML = b; $('vbtn').textContent = btn; veilAct = fn; $('veil').hidden = false; }

function next() {
  let c; do { c = KEYS[Math.random() * KEYS.length | 0]; } while (c === target);
  target = c; asked++; prog = 0; dur = secNow() * 1000; st = 'fall';
  tile.textContent = c; tile.className = 'tile'; tile.hidden = false; tile.style.left = (KEYS.indexOf(c) * 10 + 5) + '%'; setTop(0);
  keyEls[codeOf(c)].classList.add('lit');
  msg.textContent = '第 ' + asked + ' 題：請按 ' + name(c); hud();
}
function resolve() { st = 'gap'; gap = GAP; keyEls[codeOf(target)].classList.remove('lit'); }
function hit() {
  const before = secNow(); ok++; resolve(); tile.classList.add('hit'); pop(bun, 'hop');
  msg.textContent = '答對了！+1 分。' + (secNow() < before ? '加速！下一個快 1 秒。' : ''); hud();
}
function land() {
  landed++; resolve(); setTop(1); tile.classList.add('miss');
  msg.textContent = name(target) + ' 落地了，記錄 1 次，繼續下一個。'; hud();
}
function finish() {
  running = false; st = 'done'; cancelAnimationFrame(raf); tile.hidden = true; clearKeys();
  $('pause').disabled = true; $('start').textContent = '▶ 開始';
  const rate = Math.round(ok / TOTAL * 100), cm = ok >= 9 ? '太厲害了！' : ok >= 6 ? '不錯喔！' : '慢慢來，可以把滑桿調慢一點再試！';
  msg.textContent = '回合結束！答對 ' + ok + ' 題。';
  showVeil('回合結束！ ' + cm, '答對 <b>' + ok + '</b> 題 · 落地 <b>' + landed + '</b> 題 · 按錯 <b>' + wrong + '</b> 次<br>正確率 ' + rate + '%', '▶ 再玩一次', start);
}
function tick(t) {
  raf = requestAnimationFrame(tick);
  const dt = Math.min(t - last, 100); last = t;
  if (!running || paused) return;
  if (st === 'fall') { prog += dt; prog >= dur ? land() : setTop(prog / dur); }
  else if (st === 'gap') { gap -= dt; if (gap <= 0) asked >= TOTAL ? finish() : next(); }
}
function start() {
  cancelAnimationFrame(raf); clearKeys();
  running = true; paused = false; asked = ok = landed = wrong = 0; target = null;
  $('veil').hidden = true; $('start').textContent = '↻ 重新開始'; $('pause').disabled = false; $('pause').textContent = '⏸ 暫停';
  last = performance.now(); raf = requestAnimationFrame(tick); next(); game.focus({ preventScroll: true });
}
function pause(auto) {
  if (!running || paused) return;
  paused = true; saved = msg.textContent; $('pause').textContent = '▶ 繼續';
  msg.textContent = auto ? '視窗離開了，已自動暫停。' : '已暫停。';
  showVeil('⏸ 已暫停', auto ? '視窗離開了，已自動暫停。' : '準備好就繼續。', '▶ 繼續', resume);
}
function resume() {
  if (!running || !paused) return;
  paused = false; $('veil').hidden = true; $('pause').textContent = '⏸ 暫停'; msg.textContent = saved;
  game.focus({ preventScroll: true });
}

$('start').addEventListener('click', start);
$('pause').addEventListener('click', () => paused ? resume() : pause(false));
$('vbtn').addEventListener('click', () => veilAct && veilAct());
['sec', 'accel'].forEach(id => { $(id).addEventListener('input', hud); $(id).addEventListener('change', () => { hud(); if (running && !paused) game.focus({ preventScroll: true }); }); });
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(true); });
addEventListener('blur', () => { pause(true); Object.values(keyEls).forEach(k => k.classList.remove('down')); });

addEventListener('keydown', e => {
  if (e.code === 'Escape' && running) { e.preventDefault(); paused ? resume() : pause(false); return; }
  if (!running || paused || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = keyEls[e.code];
  if (!k) return;
  e.preventDefault();
  if (e.repeat) return;                // 長按不連續計分
  k.classList.add('down');
  if (st !== 'fall') return;           // 落地後的空檔不算按錯
  if (e.code === codeOf(target)) hit();
  else {
    wrong++; hud();
    msg.textContent = '按到 ' + (k.textContent === 'SPACE' ? '空白鍵' : k.textContent) + ' 了，要按 ' + name(target) + '，字還在掉，再試一次！';
    pop(field, 'shake'); k.classList.add('bad'); setTimeout(() => k.classList.remove('bad'), 250);
  }
});
addEventListener('keyup', e => { const k = keyEls[e.code]; if (k) k.classList.remove('down'); });

hud();
showVeil('掉落練習', '每回合 10 題，一次掉一個字。<br>先調好速度，再按開始！', '▶ 開始', start);
</script>
</body>
</html>
