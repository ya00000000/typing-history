<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>版本3｜鍵盤練習</title>
<style>
:root{--ink:#5a3a46;--cream:#fff7f9;--rose:#e8789b;font-family:system-ui,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--ink);line-height:1.7;box-sizing:border-box}
*{box-sizing:border-box}
body{margin:0;background:#ffe3ee}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1;image-rendering:pixelated;object-fit:cover;object-position:center bottom}
main{max-width:960px;margin:auto;padding:24px 20px 100px}
a.home{display:inline-block;padding:6px 16px;background:var(--cream);color:var(--ink);font-weight:800;text-decoration:none;border:3px solid var(--ink);box-shadow:0 4px 0 var(--rose)}
a.home:hover{background:#fff}
.head{display:flex;align-items:flex-end;gap:16px;margin:22px 0 6px}
.spr{image-rendering:pixelated;display:block}
.eyebrow{margin:0;font-size:13px;letter-spacing:.16em;font-weight:700;color:#a14a6b}
h1{margin:4px 0 0;font-size:clamp(28px,5vw,46px);line-height:1.25;font-weight:900;color:#fff;-webkit-text-stroke:8px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--rose),0 8px 0 var(--ink)}
.lead{display:inline-block;margin:18px 0 22px;padding:6px 18px;background:var(--cream);border:3px solid var(--ink);box-shadow:0 4px 0 var(--rose)}
#game{background:var(--cream);border:4px solid var(--ink);border-radius:6px;box-shadow:0 8px 0 #0003;padding:22px;outline:none}
.hud{display:flex;gap:22px;align-items:center;justify-content:center;flex-wrap:wrap}
.score{min-width:150px;text-align:center;padding:10px 18px;background:#ffeef3;border:3px solid var(--ink);font-weight:800}
.score b{display:block;font-size:44px;line-height:1.2}
.score.miss{background:#fff0e6}
.tgt{text-align:center;font-weight:800}
#target{width:clamp(100px,16vw,140px);aspect-ratio:1;display:grid;place-items:center;margin-top:4px;font-size:clamp(56px,9vw,84px);font-weight:900;color:var(--ink);
 background:#ffcc4d;border:5px solid var(--ink);box-shadow:0 8px 0 #8a4b14,inset 0 -8px 0 #e8a33a,inset 0 8px 0 #ffe58f}
#target.idle{background:#eadde1;box-shadow:0 8px 0 #b7a5ab,inset 0 -8px 0 #d6c6cb;color:#9a8790}
#target.pop{animation:pop .3s steps(3)}
#game.shake{animation:shake .3s steps(4)}
#msg{min-height:3.4em;margin:16px auto 6px;text-align:center;font-size:17px}
.ctl{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:22px}
button{font:inherit;font-size:18px;font-weight:800;padding:10px 24px;cursor:pointer;color:var(--ink);background:#ff9eb5;border:3px solid var(--ink);border-radius:4px;box-shadow:0 5px 0 #c9577a}
button.sec{background:#fff;box-shadow:0 5px 0 #b7a5ab}
button:hover:not(:disabled){filter:brightness(1.05)}
button:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 #c9577a}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid #c9577a;outline-offset:3px}
.kbs{overflow-x:auto;padding-bottom:6px}
.kbw{container-type:inline-size;width:100%;min-width:560px;max-width:880px;margin:auto}
.kb{width:95.1cqw;margin:0 auto;padding:2.4cqw 0 2.3cqw;background:#c3cdc7;border:.35cqw solid #7f978c;border-radius:2.6cqw}
.r{display:flex;gap:.83cqw;margin-bottom:1.5cqw}
.r:nth-child(1){margin-left:3.1cqw}.r:nth-child(2){margin-left:4.9cqw}.r:nth-child(3){margin-left:6.5cqw}.r:nth-child(4){margin-left:8.1cqw}
.r:nth-child(5){margin:2.1cqw 0 0 25.7cqw}
.k{position:relative;display:grid;place-items:center;width:6.1cqw;height:5.4cqw;font-size:2.4cqw;font-weight:600;color:#2a3d38;background:#faf9f3;border:.12cqw solid #8b9d93;border-radius:.9cqw;box-shadow:0 .35cqw 0 #9fb0a5;transition:transform .05s}
.k.p{background:#e4b7a3}
.k.sp{width:43.75cqw;height:3.5cqw;font-size:1.7cqw;color:#4d625a}
.k.lit{background:#c9302c;color:#fff;border-color:#7a1f1d;box-shadow:0 0 0 .5cqw #f6d7b8,0 .35cqw 0 #7a1f1d;transform:translateY(-.3cqw);animation:glow .8s steps(2) infinite}
.k.lit::after{content:"";position:absolute;bottom:.6cqw;width:.8cqw;height:.8cqw;background:#fff}
.k.down{transform:translateY(.35cqw);box-shadow:none}
.k.bad{background:#ffb3b3}
.hop{animation:hop .3s steps(3)}
@keyframes pop{50%{transform:scale(1.12)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes glow{50%{box-shadow:0 0 0 .8cqw #f6d7b8,0 .35cqw 0 #7a1f1d}}
@keyframes hop{50%{transform:translateY(-12px)}}
@media(max-width:700px){main{padding:16px 12px 90px}#game{padding:14px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="bg" width="192" height="108" aria-hidden="true"></canvas>
<main>
  <a class="home" href="../index.html">← 回到開發歷程</a>

  <div class="head">
    <canvas id="bun" class="spr" aria-hidden="true"></canvas>
    <div><p class="eyebrow">VERSION 03</p><h1>鍵盤練習</h1></div>
  </div>
  <p class="lead">看提示，按下鍵盤上同一個字母。先從 A、S、D、F 開始！</p>

  <section id="game" tabindex="-1" aria-label="練習區">
    <div class="hud">
      <div class="score">分數<b id="score">0</b></div>
      <div class="score miss">錯題數<b id="wrong">0</b></div>
      <div class="tgt">現在請按<div id="target" class="idle">?</div></div>
    </div>
    <p id="msg" role="status">按「開始」，開始練習。</p>
    <div class="ctl">
      <button id="start" type="button">▶ 開始</button>
      <button id="stop" class="sec" type="button" disabled>■ 停止練習</button>
    </div>
    <div class="kbs" aria-hidden="true"><div class="kbw"><div class="kb" id="kb"></div></div></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const INK = '#5a3a46';
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; };
const R = (g, col, ...a) => { g.fillStyle = col; a.forEach(([x, y, w, h]) => g.fillRect(x, y, w, h)); };
const disc = (g, col, cx, cy, r) => { g.fillStyle = col; for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) if (x * x + y * y <= r * r + r * .6) g.fillRect(cx + x, cy + y, 1, 1); };

/* ---------- 像素小圖 ---------- */
function bunny() {
  const [c, g] = mk(28, 33), B = [[5,9,18,14],[3,11,22,10],[6,0,5,12],[17,1,5,11],[7,22,14,6],[6,23,16,4],[6,27,6,3],[16,27,6,3],[3,23,4,4],[21,23,4,4]], LF = [[11,7,3,2],[14,5,3,2],[13,8,1,2]];
  const f = (col, x, y, w, h) => { g.fillStyle = col; g.fillRect(x + 1, y + 1, w, h); };
  g.fillStyle = INK; B.concat(LF).forEach(([x, y, w, h]) => g.fillRect(x, y, w + 2, h + 2));
  B.forEach(r => f('#fffaf0', ...r)); LF.forEach(r => f('#6bcb77', ...r));
  f('#f3e2d2',10,25,8,2); f('#ffadc6',7,2,3,8); f('#ffadc6',18,3,3,7); f('#ffadc6',6,18,3,2); f('#ffadc6',19,18,3,2);
  f('#ffadc6',13,17,2,1); f('#d9546a',13,18,2,2); f('#ff7aa2',6,21,16,3); f('#e8456b',18,23,3,4);
  f('#2b2233',9,15,2,3); f('#2b2233',17,15,2,3); f('#fff',9,15,1,1); f('#fff',17,15,1,1);
  return c;
}
function tree() {
  const [c, g] = mk(36, 40);
  R(g, INK, [15,23,7,16]); R(g, '#c99a86', [16,23,5,15]); R(g, '#a97a68', [19,23,2,15]);
  disc(g, INK, 18, 15, 12); disc(g, '#7cc794', 18, 15, 11); disc(g, '#9fdcae', 17, 13, 9); R(g, '#c8f2d0', [11,6,4,2],[10,8,2,2]);
  [[9,11],[22,8],[16,18],[25,16],[12,19],[20,12]].forEach(([x, y]) => { R(g, '#e8456b', [x,y,3,3]); R(g, '#fff', [x,y,1,1]); });
  return c;
}
const BUN = bunny(), bun = $('bun');
bun.width = 28; bun.height = 33; bun.getContext('2d').drawImage(BUN, 0, 0); bun.style.width = '84px'; bun.style.height = '99px';

(function () {
  const g = $('bg').getContext('2d'), GY = 92, T = tree();
  ['#ffe9f0', '#ffdfea', '#ffd3e1', '#ffc8d9'].forEach((c, i) => R(g, c, [0, i * 24, 192, 24]));
  disc(g, '#fff3b8', 152, 22, 9);
  [[18,20],[70,34],[118,14],[168,46]].forEach(([x, y]) => R(g, '#fff', [x, y, 24, 5], [x + 5, y - 4, 13, 4]));
  for (let x = 0; x < 192; x++) { const h = 24 + 8 * Math.sin(x / 26) + 3 * Math.sin(x / 8); R(g, '#d9f1df', [x, GY - h, 1, h]); }
  [6, 34, 58, 104, 132, 172].forEach(x => { for (let j = 0; j < 3; j++) { const w = 6 + j * 5; R(g, '#a5dbb4', [x - (w >> 1), GY - 32 + j * 7, w, 8]); } R(g, '#c99a86', [x - 1, GY - 12, 3, 12]); });
  for (let x = 0; x < 192; x++) { const h = 10 + 6 * Math.sin(x / 17 + 2); R(g, '#bfe6c8', [x, GY - h, 1, h]); }
  R(g, '#9bd8a8', [0, GY, 192, 16]); R(g, '#bff0c8', [0, GY, 192, 3]);
  g.drawImage(T, 10, GY - 35); g.drawImage(T, 148, GY - 36);
  [[48,6],[82,9],[112,5],[134,10],[70,11],[180,8],[26,10]].forEach(([x, y]) => { R(g, '#ffb3cc', [x+3,GY+y,3,3],[x,GY+y+3,3,3],[x+6,GY+y+3,3,3],[x+3,GY+y+6,3,3]); R(g, '#ffe066', [x+3,GY+y+3,3,3]); });
})();

/* ---------- 用 CSS 做的英文鍵盤 ---------- */
const SYM = { '-':'Minus','=':'Equal','[':'BracketLeft',']':'BracketRight',';':'Semicolon',"'":'Quote',',':'Comma','.':'Period','/':'Slash' };
const codeOf = ch => /[A-Z]/.test(ch) ? 'Key' + ch : /\d/.test(ch) ? 'Digit' + ch : SYM[ch];
const keyEls = {};
['1234567890-=', 'QWERTYUIOP[]', "ASDFGHJKL;'", 'ZXCVBNM,./', null].forEach((row, ri) => {
  const r = document.createElement('div'); r.className = 'r';
  (row ? [...row] : ['SPACE']).forEach((ch, i) => {
    const k = document.createElement('div'); k.className = 'k'; k.textContent = ch;
    if (!row) { k.classList.add('sp'); keyEls.Space = k; }
    else { if (ri === 2 && i < 10) k.classList.add('p'); keyEls[codeOf(ch)] = k; }
    r.appendChild(k);
  });
  $('kb').appendChild(r);
});

/* ---------- 練習 ---------- */
const LETTERS = ['A', 'S', 'D', 'F'];
let running = false, score = 0, wrong = 0, target = null;
const tEl = $('target'), msg = $('msg'), game = $('game');

function setScore() { $('score').textContent = score; $('wrong').textContent = wrong; }
function clearLit() { Object.values(keyEls).forEach(k => k.classList.remove('lit', 'down', 'bad')); }
function pop(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
function nextQuestion() {
  let c; do { c = LETTERS[Math.random() * LETTERS.length | 0]; } while (c === target);
  if (target) keyEls['Key' + target].classList.remove('lit');
  target = c; tEl.textContent = c; tEl.classList.remove('idle'); keyEls['Key' + c].classList.add('lit');
  return c;
}
function start() {
  running = true; score = 0; wrong = 0; target = null; setScore(); clearLit();
  $('start').textContent = '↻ 重新開始'; $('stop').disabled = false;
  msg.textContent = '開始！請按 ' + nextQuestion();
  game.focus({ preventScroll: true });
}
function stop() {
  running = false; target = null; clearLit();
  tEl.textContent = '?'; tEl.classList.add('idle');
  $('start').textContent = '▶ 開始'; $('stop').disabled = true;
  msg.textContent = '練習結束，這次得到 ' + score + ' 分，答錯 ' + wrong + ' 題。想再練一次，就按「開始」。';
  $('start').focus({ preventScroll: true });
}
$('start').addEventListener('click', start);
$('stop').addEventListener('click', stop);

addEventListener('keydown', e => {
  if (!running || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = keyEls[e.code];
  if (!k) return;                      // 只處理畫面上有的鍵（Shift、Tab、方向鍵等不算）
  e.preventDefault();
  if (e.repeat) return;                // 長按不連續計分
  k.classList.add('down');
  if (e.code === 'Key' + target) {
    score++; setScore(); pop(tEl, 'pop'); pop(bun, 'hop');
    msg.textContent = '答對了！+1 分。下一個請按 ' + nextQuestion();
  } else {
    wrong++; setScore();
    const shown = k.textContent === 'SPACE' ? '空白鍵' : k.textContent;
    msg.textContent = '按到 ' + shown + ' 了，這題要按 ' + target + '，再試一次！';
    pop(game, 'shake'); k.classList.add('bad'); setTimeout(() => k.classList.remove('bad'), 250);
  }
});
addEventListener('keyup', e => { const k = keyEls[e.code]; if (k) k.classList.remove('down'); });
addEventListener('blur', () => Object.values(keyEls).forEach(k => k.classList.remove('down')));
</script>
</body>
</html>
