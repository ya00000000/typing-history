<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>英打遊戲開發歷程</title><style>
[hidden]{display:none!important}:root{font-family:system-ui,"Microsoft JhengHei",sans-serif;color:#243e38;background:#f5f3ec;line-height:1.7}*{box-sizing:border-box}body{margin:0}main{max-width:1040px;margin:auto;padding:36px 24px}h1{font-size:clamp(28px,4.5vw,44px);line-height:1.3;margin:12px 0 18px}h2{font-size:22px}p{margin:12px 0}a{color:#205d50}button,input{font:inherit}button,.action{display:inline-block;padding:12px 22px;border:1px solid #426d5e;background:#426d5e;color:#fff;border-radius:12px;text-decoration:none;cursor:pointer}button.secondary{background:#fff;color:#284c40}button:disabled{opacity:.5;cursor:default}button:hover:not(:disabled),.action:hover{filter:brightness(.95)}:focus-visible{outline:3px solid #b16b35;outline-offset:4px}.eyebrow{font-size:13px;letter-spacing:.14em;color:#596f62}.panel{background:white;border:1px solid #ccd7ce;border-radius:20px;padding:24px;margin:20px 0}.muted,small{color:#526459}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}#message{min-height:2em}input[type=url]{width:100%;padding:12px;border:1px solid #8a9f90;border-radius:9px;margin:6px 0 14px}label{display:block}details{background:#eef0e8;border-radius:14px;padding:16px;margin-top:24px}summary{cursor:pointer;font-weight:650}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{display:flex;flex-direction:column;background:white;border:1px solid #ccd7ce;border-radius:18px;padding:24px;min-height:260px}.card p{flex:1}.badge{font-size:12px;color:#526459}.card a{margin-top:14px}a[aria-disabled=true]{color:#6b716c;background:#eeeee8;border-color:#bbb;cursor:not-allowed}.keyboard-wrap{overflow:auto;padding:10px 0}.keyboard{min-width:620px;max-width:870px;margin:auto;background:#d5ddd5;padding:14px;border-radius:18px}.keyrow{display:flex;justify-content:center;gap:6px;margin:6px 0}.key{display:grid;place-items:center;width:52px;height:48px;border-radius:8px;border:1px solid #98ad9e;border-bottom-width:4px;background:#f9faf4;color:#53645a;font-size:20px;font-weight:700}.key.practice{background:#e4bbab;color:#452e25}.key.lit{background:#a1332e;color:white;border-color:#682a28;box-shadow:0 0 0 3px #f1d6bc;transform:translateY(-2px)}.key.lit:after{content:'●';font-size:7px;line-height:1}.score{display:flex;gap:14px;flex-wrap:wrap}.score span{background:#edf1e9;padding:8px 14px;border-radius:10px}.score b{font-size:26px}.target{font-size:80px;font-weight:800;line-height:1.2;margin:14px}.game{text-align:center;outline-offset:5px}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.controls label{flex:1;min-width:200px}input[type=range]{width:100%;accent-color:#426d5e}.sky{height:300px;position:relative;overflow:hidden;border-radius:18px;background:linear-gradient(#e2edf0,#f5f0df);border-bottom:8px solid #a5b794}.sky:before{content:'落地前，按下對應的英文字母';position:absolute;top:12px;left:16px;color:#506664;font-size:13px}.falling{position:absolute;left:50%;transform:translateX(-50%);width:60px;height:60px;display:grid;place-items:center;border-radius:16px;background:#ab4939;color:white;font-size:36px;font-weight:bold;box-shadow:0 6px 0 #d2aa92}.help{font-size:14px}body.completed .sky{background:#e4ebdf}@media(max-width:700px){main{padding:22px 14px}.cards{grid-template-columns:1fr}.card{min-height:190px}.panel{padding:16px}}
</style></head><body><main><p class="eyebrow">MY TYPING JOURNEY</p><h1>英打遊戲開發歷程</h1><p>從第一個頁面開始，記錄每一次完成的小進步。</p><div class="cards"><article class="card"><span class="badge">VERSION 01</span><h2>版本1</h2><p>一個標題、一個按鈕。我的第一次網站部署。</p><a class="action" href="#" id="link1" aria-disabled="true" target="_blank" rel="noopener">先設定網站網址</a></article><article class="card"><span class="badge">VERSION 02</span><h2>版本2</h2><p>加入外部圖片與聲音，讓遊戲預告有了聲音。</p><a class="action" href="#" id="link2" aria-disabled="true" target="_blank" rel="noopener">先設定網站網址</a></article><article class="card"><span class="badge">VERSION 03</span><h2>版本3</h2><p>下一段旅程，準備開始。</p><a class="action" href="coming-soon.html"  >Coming Soon</a></article></div><p id="message" role="status"></p><details id="config"><summary>首次設定：填入版本一、版本二的網址</summary><p>這兩個版本是不同 repo 的網站。設定後會下載新的首頁檔案；請用它取代原本的 index.html，再上傳。設定不是只存在這台電腦裡。</p><form id="settings"><label for="url1">版本一的網站網址</label><input id="url1" type="url" placeholder="https://你的帳號.github.io/typing-v1/" required><label for="url2">版本二的網站網址</label><input id="url2" type="url" placeholder="https://你的帳號.github.io/typing-v2/" required><button type="submit">套用網址並下載 index.html</button></form></details></main><script>
const $=id=>document.getElementById(id);
function validWebsite(value){let url;try{url=new URL(value.trim());}catch{throw new Error('請貼完整的 https:// 網站網址。');}if(url.protocol!=='https:'||!url.hostname.endsWith('.github.io')||url.username||url.password)throw new Error('請貼 GitHub Pages 網站網址（https://帳號.github.io/專案/），不要貼 github.com 的 repo 網址。');return url.href;}
for(const id of ['link1','link2'])$(id).addEventListener('click',e=>{if($(id).getAttribute('aria-disabled')==='true'){e.preventDefault();$('config').open=true;$('message').textContent='請先在下方填入自己的版本一與版本二網站網址。';}});
$('settings').addEventListener('submit',e=>{e.preventDefault();try{
 const urls=[validWebsite($('url1').value),validWebsite($('url2').value)];if(urls[0]===urls[1])throw new Error('兩個版本應填不同的網站網址。');
 urls.forEach((url,i)=>{const link=$('link'+(i+1));link.setAttribute('href',url);link.removeAttribute('aria-disabled');link.textContent='開啟版本'+(i+1);$('url'+(i+1)).setAttribute('value',url);});
 $('message').textContent='已套用。請把下載的 index.html 放回這個入口網站資料夾並取代原檔，再上傳 GitHub。';$('config').open=false;
 const blob=new Blob(['<!doctype html>\n'+document.documentElement.outerHTML],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='index.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
 }catch(e){$('message').textContent=e.message;}});

</script></body></html>
